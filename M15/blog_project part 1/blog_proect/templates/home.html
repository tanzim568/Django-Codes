{%block content%}

<div class="container mx-auto d-flex flex-wrap justify-content-center align-items-baseline m-2 ">
        {%for i in post%}   
        <div class="col-sm-3 m-2">
          <div class="card px-3">
            <div class="card-body">
              <h5 class="card-title">{{i.title}}</h5>
              <p class="card-text">{{i.content}}</p>
              <small>
                <p>Author :{{i.author.name}} </p>
                <p >Category : 
                    {% for cat in i.category.all %}
                    <button class="btn btn-warning btn-sm mt-1 " disabled> {{cat.name}}</button>  
                   
                    {% endfor %}
                </p>
              </small>
              <a href="{% url 'edit_post' i.id%}" class="btn btn-success">Edit</a>
              <a href="{% url 'delete_post' i.id%}" class="btn btn-danger">Delete</a>
            </div>
          </div>
        </div>
        {%endfor%}
      </div>

{%endblock%}
