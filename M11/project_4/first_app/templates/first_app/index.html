{% extends 'base.html' %}

{% load static%}

<!DOCTYPE html>
<html lang="en">

<h1>{{request.GET.rabbi}}</h1>

            <th scope="col">ID</th>

            <td>{{i.id}}</td>

            <td>{{i.body}}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
